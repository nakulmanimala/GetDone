name: getdone

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: getdone-web:local
    container_name: getdone-web
    restart: unless-stopped
    init: true
    ports:
      - "${GETDONE_PORT:-3080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
