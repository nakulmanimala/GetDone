name: getdone

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: getdone-web:local
    container_name: getdone-web
    restart: unless-stopped
    init: true
    depends_on:
      sync:
        condition: service_healthy
    ports:
      - "${GETDONE_PORT:-3080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: getdone-sync:local
    container_name: getdone-sync
    restart: unless-stopped
    init: true
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_SDK_LOAD_CONFIG=1
      - AWS_REGION=${AWS_REGION:-}
      - S3_BUCKET=${S3_BUCKET}
      - S3_SNAPSHOT_KEY=${S3_SNAPSHOT_KEY:-getdone/snapshot.json.enc}
      - SYNC_API_TOKEN=${SYNC_API_TOKEN}
      - SYNC_ENCRYPTION_KEY=${SYNC_ENCRYPTION_KEY}
      - PORT=8081
    volumes:
      - ${HOME}/.aws:/home/getdone/.aws:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
